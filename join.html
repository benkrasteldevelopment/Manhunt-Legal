<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manhunt – Runde beitreten</title>
<meta property="og:title" content="Manhunt – Join my round / Tritt meiner Runde bei">
<meta property="og:description" content="GPS hide & seek with friends. Tap to join. / GPS-Versteckspiel mit Freunden. Tippen zum Beitreten.">
<meta name="apple-itunes-app" content="app-id=6809771773">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, #060508 0%, #4a0c12 100%);
    background-attachment: fixed;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
    text-align: center;
  }
  main { width: 100%; max-width: 380px; }
  .logo { font-size: 13px; letter-spacing: 6px; font-weight: 800; opacity: .85; }
  h1 { font-size: 24px; margin: 18px 0 8px; }
  .code {
    font: 700 40px/1 ui-monospace, "SF Mono", Menlo, monospace;
    letter-spacing: 6px; margin: 22px 0 6px;
    padding: 18px 10px; border-radius: 16px; background: rgba(255,255,255,.08);
    user-select: all; -webkit-user-select: all;
  }
  .hint { font-size: 13px; opacity: .6; margin: 0 0 26px; }
  .btn {
    display: block; width: 100%; padding: 16px; border-radius: 14px;
    font-size: 17px; font-weight: 600; text-decoration: none; margin-top: 12px;
  }
  .primary { background: #ff8a1f; color: #1a0a00; }
  .secondary { background: rgba(255,255,255,.12); color: #fff; }
  .small { font-size: 13px; opacity: .55; margin-top: 26px; line-height: 1.5; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <div class="logo">MANHUNT</div>

  <div id="with-code" class="hidden">
    <h1 data-de="Du wurdest eingeladen!" data-en="You've been invited!"></h1>
    <div class="code" id="code"></div>
    <p class="hint" data-de="Beitrittscode" data-en="Join code"></p>
    <a class="btn primary" id="open-app" href="#" data-de="In Manhunt öffnen" data-en="Open in Manhunt"></a>
    <a class="btn secondary" href="https://apps.apple.com/app/id6809771773"
       data-de="App noch nicht installiert? Hier laden" data-en="Don't have the app yet? Get it here"></a>
    <p class="small" data-de="Falls sich die App nicht öffnet: Manhunt starten, „Runde beitreten“ tippen und den Code oben eingeben."
       data-en="If the app doesn't open: launch Manhunt, tap “Join round” and enter the code above."></p>
  </div>

  <div id="without-code" class="hidden">
    <h1 data-de="GPS-Versteckspiel mit Freunden" data-en="GPS hide & seek with friends"></h1>
    <a class="btn primary" href="https://apps.apple.com/app/id6809771773"
       data-de="Im App Store laden" data-en="Get it on the App Store"></a>
  </div>
</main>

<script>
  // Sprache: Deutsch für deutschsprachige Geräte, sonst Englisch
  var lang = (navigator.language || "en").toLowerCase().indexOf("de") === 0 ? "de" : "en";
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-" + lang + "]").forEach(function (el) {
    el.textContent = el.getAttribute("data-" + lang);
  });
  if (lang === "en") document.title = "Manhunt – Join round";

  // Code prüfen: nur 6 Zeichen A-Z / 0-9 werden akzeptiert
  var raw = new URLSearchParams(window.location.search).get("code") || "";
  var code = raw.toUpperCase();
  if (/^[A-Z0-9]{6}$/.test(code)) {
    document.getElementById("code").textContent = code;
    document.getElementById("open-app").href = "manhunt://join?code=" + code;
    document.getElementById("with-code").classList.remove("hidden");
  } else {
    document.getElementById("without-code").classList.remove("hidden");
  }
</script>
</body>
</html>
